<!doctype html>
<html lang="uk-UA">
  <head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title, description, canonical, Open Graph, Twitter — задаються на кожній сторінці через useSeo() (src/helpers/seo.js) -->
    <title>Скачати безкоштовний софт | Floppy</title>

    <!-- Тема до першого рендеру, щоб не було спалаху: збережений вибір (ThemeToggle.vue) або системна -->
    <script>
      ;(function () {
        var root = document.documentElement
        var media = window.matchMedia('(prefers-color-scheme: dark)')
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        root.classList.toggle('dark', saved ? saved === 'dark' : media.matches)
        media.addEventListener('change', function (e) {
          var current = null
          try {
            current = localStorage.getItem('theme')
          } catch (err) {}
          if (!current) root.classList.toggle('dark', e.matches)
        })
      })()
    </script>

    <!-- Шрифти: Onest (кирилиця) та JetBrains Mono для версій -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">

    <!-- Favicons -->
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <meta name="apple-mobile-web-app-title" content="FloppY">
    <link rel="manifest" href="/site.webmanifest">

  </head>
  <body>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "FloppY",
        "alternateName": ["FL"],
        "url": "https://floppy.pp.ua/"
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <div itemscope itemtype="https://schema.org/WebSite">
      <link itemprop="url" href="https://floppy.pp.ua" />
      <meta itemprop="name" content="FloppY" />
      <meta itemprop="alternateName" content="FL" />
    </div>
  </body>
</html>
